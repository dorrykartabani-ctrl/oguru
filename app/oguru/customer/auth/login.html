<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>OGuru - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&family=Manrope:wght@400;500;600&family=Hanken+Grotesk:wght@600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100..900&family=Hanken+Grotesk:wght@100..900&family=Manrope:wght@100..900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "on-background": "#1b1c19",
                        "on-surface-variant": "#44483a",
                        "surface-container-highest": "#e4e2dd",
                        "surface-dim": "#dbdad5",
                        "on-surface": "#1b1c19",
                        "surface-variant": "#e4e2dd",
                        "on-tertiary-container": "#fffbff",
                        "surface-tint": "#4c6713",
                        "surface-container": "#f0eee9",
                        "primary-container": "#627e29",
                        "primary": "#4a6410",
                        "secondary-fixed": "#ffdbd0",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#795950",
                        "secondary-container": "#fed3c7",
                        "on-primary-container": "#faffe7",
                        "primary-fixed": "#cdee8c",
                        "on-secondary-fixed": "#2c160e",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fbf9f4",
                        "surface": "#fbf9f4",
                        "on-secondary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary": "#77574d",
                        "inverse-primary": "#b2d273",
                        "on-primary-fixed": "#141f00",
                        "tertiary": "#924700",
                        "on-tertiary-fixed": "#311300",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#30312e",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#374e00",
                        "tertiary-fixed": "#ffdcc6",
                        "primary-fixed-dim": "#b2d273",
                        "tertiary-container": "#b75b00",
                        "background": "#fbf9f4",
                        "secondary-fixed-dim": "#e7bdb1",
                        "outline-variant": "#c5c8b6",
                        "outline": "#757969",
                        "surface-container-high": "#eae8e3",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#5d4037",
                        "inverse-on-surface": "#f2f1ec",
                        "surface-container-low": "#f5f3ee",
                        "on-tertiary-fixed-variant": "#723600",
                        "tertiary-fixed-dim": "#ffb786"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "margin-desktop": "40px",
                        "unit": "8px",
                        "container-max": "1280px"
                    },
                    "fontFamily": {
                        "label-sm": ["Hanken Grotesk"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Be Vietnam Pro"],
                        "headline-lg-mobile": ["Be Vietnam Pro"],
                        "body-md": ["Manrope"],
                        "display-lg": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        body {
            background-color: #fbf9f4;
            color: #1b1c19;
            -webkit-tap-highlight-color: transparent;
        }

        .grain-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 9999;
            background-image: url("https://www.transparenttextures.com/patterns/p6.png");
        }

        .organic-shadow {
            box-shadow: 0 4px 12px rgba(93, 64, 55, 0.08);
        }

        .field-inset {
            box-shadow: inset 0 2px 4px rgba(93, 64, 55, 0.06);
        }

        /* Toggle animation */
        .form-section {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .form-section.hidden-state {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            position: absolute;
        }

        .form-section.visible-state {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }
    </style>
</head>

<body class="font-body-md text-on-surface min-h-screen flex flex-col">
    <div class="grain-overlay"></div>

    <!-- Back button -->
    <div class="fixed top-0 left-0 w-full z-50 px-margin-mobile pt-4">
        <button id="backBtn"
            class="p-2 rounded-full hover:bg-surface-container-high active:scale-95 transition-all duration-150">
            <span class="material-symbols-outlined text-on-surface">arrow_back</span>
        </button>
    </div>

    <!-- Main content -->
    <main class="flex-1 flex flex-col justify-center px-margin-mobile max-w-lg mx-auto w-full py-20">

        <!-- Logo -->
        <div class="mb-8">
            <h1 class="font-display-lg text-display-lg text-primary tracking-tight leading-none">OGuru</h1>
        </div>

        <!-- Heading area -->
        <div class="mb-8">
            <h2 id="formHeading" class="font-headline-lg-mobile text-headline-lg-mobile text-on-background leading-tight mb-2">
                Create your account
            </h2>
            <p class="text-on-surface-variant font-body-md opacity-80">
                Find and pre-order from your favourite local spots.
            </p>
        </div>

        <!-- Form -->
        <form id="authForm" class="mb-8" onsubmit="return false;">

            <!-- Sign Up fields -->
            <div id="signupFields" class="form-section visible-state">
                <!-- First name -->
                <div class="mb-4">
                    <label for="firstName"
                        class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">
                        First name
                    </label>
                    <input id="firstName" type="text" placeholder="Alex"
                        class="w-full px-4 py-4 rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary transition-all font-body-md text-on-surface placeholder:text-outline field-inset" />
                </div>

                <!-- Email or phone -->
                <div class="mb-6">
                    <label for="emailSignup"
                        class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">
                        Email or mobile number
                    </label>
                    <input id="emailSignup" type="text" placeholder="alex@example.com"
                        class="w-full px-4 py-4 rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary transition-all font-body-md text-on-surface placeholder:text-outline field-inset" />
                </div>
            </div>

            <!-- Log In fields -->
            <div id="loginFields" class="form-section hidden-state">
                <!-- Email or phone only -->
                <div class="mb-6">
                    <label for="emailLogin"
                        class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">
                        Email or mobile number
                    </label>
                    <input id="emailLogin" type="text" placeholder="alex@example.com"
                        class="w-full px-4 py-4 rounded-xl border-none bg-surface-container-low focus:ring-2 focus:ring-primary transition-all font-body-md text-on-surface placeholder:text-outline field-inset" />
                </div>
            </div>

            <!-- Continue button -->
            <button id="continueBtn" type="submit"
                class="w-full py-4 rounded-xl bg-primary text-on-primary font-label-sm text-label-sm uppercase tracking-wider active:scale-[0.98] transition-all duration-150 organic-shadow hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                disabled>
                <span id="btnText">CONTINUE</span>
                <!-- Loading spinner (hidden by default) -->
                <span id="btnLoader" class="hidden">
                    <svg class="animate-spin h-5 w-5 mx-auto text-on-primary" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                </span>
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 mb-8">
            <div class="flex-1 h-px bg-outline-variant/40"></div>
            <span class="text-on-surface-variant font-body-md text-sm opacity-70">or continue with</span>
            <div class="flex-1 h-px bg-outline-variant/40"></div>
        </div>

        <!-- Social login buttons -->
        <div class="flex gap-4 mb-10">
            <!-- Google -->
            <button
                class="flex-1 flex items-center justify-center gap-3 px-4 py-3.5 rounded-xl border border-outline-variant/30 bg-surface-container-low hover:bg-surface-container-high active:scale-[0.98] transition-all duration-150">
                <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                <span class="font-label-sm text-label-sm text-on-surface">Google</span>
            </button>

            <!-- Apple -->
            <button
                class="flex-1 flex items-center justify-center gap-3 px-4 py-3.5 rounded-xl border border-outline-variant/30 bg-surface-container-low hover:bg-surface-container-high active:scale-[0.98] transition-all duration-150">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#1b1c19" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                </svg>
                <span class="font-label-sm text-label-sm text-on-surface">Apple</span>
            </button>
        </div>

        <!-- Footer toggle -->
        <div class="text-center">
            <p id="toggleText" class="text-on-surface-variant font-body-md">
                Already have an account?
                <button id="toggleBtn"
                    class="text-primary font-semibold border-b border-primary/30 hover:border-primary transition-colors">
                    Log in
                </button>
            </p>
        </div>

    </main>

    <!-- Terms footer -->
    <footer class="px-margin-mobile pb-8 max-w-lg mx-auto w-full">
        <p class="text-center text-on-surface-variant/60 text-xs font-body-md leading-relaxed">
            By continuing, you agree to OGuru's
            <a href="#" class="underline hover:text-primary">Terms of Service</a>
            and
            <a href="#" class="underline hover:text-primary">Privacy Policy</a>.
        </p>
    </footer>

    <script>
        // State
        let isSignUp = true;

        // Elements
        const formHeading = document.getElementById('formHeading');
        const signupFields = document.getElementById('signupFields');
        const loginFields = document.getElementById('loginFields');
        const toggleBtn = document.getElementById('toggleBtn');
        const toggleText = document.getElementById('toggleText');
        const continueBtn = document.getElementById('continueBtn');
        const btnText = document.getElementById('btnText');
        const firstName = document.getElementById('firstName');
        const emailSignup = document.getElementById('emailSignup');
        const emailLogin = document.getElementById('emailLogin');

        // Toggle between sign up and log in
        toggleBtn.addEventListener('click', () => {
            isSignUp = !isSignUp;

            if (isSignUp) {
                formHeading.textContent = 'Create your account';
                signupFields.classList.remove('hidden-state');
                signupFields.classList.add('visible-state');
                loginFields.classList.remove('visible-state');
                loginFields.classList.add('hidden-state');
                btnText.textContent = 'CONTINUE';
                toggleText.innerHTML = `Already have an account? <button id="toggleBtn" class="text-primary font-semibold border-b border-primary/30 hover:border-primary transition-colors">Log in</button>`;
            } else {
                formHeading.textContent = 'Welcome back';
                signupFields.classList.remove('visible-state');
                signupFields.classList.add('hidden-state');
                loginFields.classList.remove('hidden-state');
                loginFields.classList.add('visible-state');
                btnText.textContent = 'LOG IN';
                toggleText.innerHTML = `Don't have an account? <button id="toggleBtn" class="text-primary font-semibold border-b border-primary/30 hover:border-primary transition-colors">Sign up</button>`;
            }

            // Re-bind the new toggle button
            document.getElementById('toggleBtn').addEventListener('click', () => {
                toggleBtn.click();
            });

            validateForm();
        });

        // Form validation
        function validateForm() {
            let isValid = false;

            if (isSignUp) {
                const nameVal = firstName.value.trim();
                const emailVal = emailSignup.value.trim();
                isValid = nameVal.length >= 1 && emailVal.length >= 3;
            } else {
                const emailVal = emailLogin.value.trim();
                isValid = emailVal.length >= 3;
            }

            continueBtn.disabled = !isValid;
        }

        // Listen to inputs
        firstName.addEventListener('input', validateForm);
        emailSignup.addEventListener('input', validateForm);
        emailLogin.addEventListener('input', validateForm);

        // Form submit simulation
        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (continueBtn.disabled) return;

            // Show loading state
            btnText.classList.add('hidden');
            document.getElementById('btnLoader').classList.remove('hidden');
            continueBtn.disabled = true;

            // Simulate API call
            setTimeout(() => {
                btnText.classList.remove('hidden');
                document.getElementById('btnLoader').classList.add('hidden');
                continueBtn.disabled = false;

                // In real app: navigate to location permission screen
                alert('Success! Next screen: Location Permission');
            }, 1500);
        });

        // Back button
        document.getElementById('backBtn').addEventListener('click', () => {
            // In real app: navigate back to vendor/customer fork
            window.history.back();
        });

        // Haptic feedback
        document.querySelectorAll('button').forEach(el => {
            el.addEventListener('click', () => {
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(5);
                }
            });
        });
    </script>
</body>
</html>
